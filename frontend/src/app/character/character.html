<div class="character-status">
  <span class="fighter-name">{{ name() }}</span>
  <div class="effect-icons" aria-hidden="true">
    @for (fx of effects(); track fx.id) {
      <div class="effect-icon" [title]="effectSpellName(fx.sourceSpellId)">
        <img [src]="spellIconPath(fx.sourceSpellId)" [alt]="effectSpellName(fx.sourceSpellId)" />
        <span class="effect-icon-timer">{{ formatCooldown(fx.remainingMs) }}</span>
      </div>
    }
  </div>
  <div class="hp-bar"><div class="hp-fill" [style.width.%]="hpPercent()"></div></div>
</div>
<div class="character-sprite-wrap">
  <div class="floating-numbers" aria-hidden="true">
    @for (n of floatingNumbers(); track n.id) {
      <span class="floating-number" [class.floating-number--heal]="n.kind === 'heal'">{{ n.text }}</span>
    }
  </div>
  <canvas class="sprite-canvas" #spriteCanvas aria-hidden="true"></canvas>
</div>

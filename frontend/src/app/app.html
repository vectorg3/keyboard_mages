<main class="stage" (click)="onStageClick($event)">
  <header class="title-row" aria-label="Keyboard Mages">
    @for (row of titleRows; track row.word) {
      <div class="key-word">
        @for (letter of row.letters; track letter.index) {
          <span
            class="key"
            [style.--i]="letter.index"
            [style.background-image]="'url(' + keySpritePath(letter.char, false) + ')'"
            aria-hidden="true"
          ></span>
        }
      </div>
    }
  </header>

  @if (socket.match()) {
    <app-match [youMageType]="youMageType()" />
  } @else {
    <app-lobby [youMageType]="youMageType()" (schoolSelected)="youMageType.set($event)" />
  }
</main>
